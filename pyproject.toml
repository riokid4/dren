[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ais-kb"
version = "0.1.0"
description = "Standalone AI Safety Knowledge Base - Clean-room mechanistic knowledge assembly"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ais_kb"]
